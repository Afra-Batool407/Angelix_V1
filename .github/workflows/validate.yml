name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Run lesson MVP validator (content, scenes, wiring)
        run: python3 tools/validate_lesson_mvp.py

      - name: gdparse all GDScript
        run: |
          fail=0
          while IFS= read -r f; do
            gdparse "$f" || fail=1
          done < <(git ls-files '*.gd')
          exit $fail

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot 4.7.2 headless
        run: |
          curl -sL --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Import project (build class/resource cache)
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Compile-check every GDScript with real Godot
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/check_all_scripts.gd

      - name: Load and instantiate every scene with real Godot
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/load_all_scenes.gd

      - name: Runtime smoke test (presentation flow, scoring, persistence)
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tools/smoke_presentation.gd
